<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#1ed760" />
      <stop offset="60%" stop-color="#1db954" />
      <stop offset="100%" stop-color="#14833b" />
    </radialGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181818" />
      <stop offset="100%" stop-color="#121212" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Background Base Circle -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#innerGrad)" stroke="#282828" stroke-width="8" />

  <!-- Outer Glowing Music Disc -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#bgGrad)" stroke-width="24" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#222222" stroke-width="6" />

  <!-- Spotify Sound Waves / Downloader Arrow Combined -->
  <!-- Sound Wave 1 (Top) -->
  <path d="M 140 195 A 160 160 0 0 1 372 195" fill="none" stroke="#1db954" stroke-width="26" stroke-linecap="round" />
  <!-- Sound Wave 2 (Middle) -->
  <path d="M 170 240 A 120 120 0 0 1 342 240" fill="none" stroke="#1db954" stroke-width="24" stroke-linecap="round" />

  <!-- Downloader Arrow with Safe Lock Accent -->
  <path d="M 256 220 L 256 360" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" />
  <path d="M 210 320 L 256 366 L 302 320" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="180" y1="400" x2="332" y2="400" stroke="#1db954" stroke-width="22" stroke-linecap="round" />

  <!-- Highlight Sheen -->
  <rect x="24" y="24" width="464" height="232" rx="100" fill="url(#glowGrad)" />
</svg>
